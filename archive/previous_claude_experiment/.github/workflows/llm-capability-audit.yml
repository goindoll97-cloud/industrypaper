name: LLM capability study baseline audit
on:
  push:
    paths:
      - "llm_capability_study/**"
      - "data/retrieval_INPUT.csv"
      - "data/retrieval_GOLD.csv"
      - "data/regulatory_catalog.csv"
      - "intermediate/shared_pubchem_smiles.csv"
      - "review/retrieval_gold_manual_review.csv"
      - ".github/workflows/llm-capability-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check
        run: python -m py_compile llm_capability_study/audit_baseline.py llm_capability_study/prereview_candidates.py llm_capability_study/collect_boundary_candidates.py llm_capability_study/collect_candidates.py llm_capability_study/collect_mixtures.py llm_capability_study/build_validation_dataset.py llm_capability_study/audit_gold_readiness.py llm_capability_study/audit_sampling_design.py
      - name: Candidate pre-review tests
        run: |
          pip install rdkit
          python llm_capability_study/tests/test_prereview.py
          python llm_capability_study/tests/test_validation_pipeline.py
          python llm_capability_study/tests/test_sampling_design.py
          python llm_capability_study/tests/test_collect_candidates.py
      - name: Audit frozen baseline and review signoffs
        run: python llm_capability_study/audit_baseline.py
      - name: Verify Gold queue and freeze safeguards
        run: python llm_capability_study/tests/test_gold_readiness.py
      - name: Generate prioritized Gold audit and draft data
        run: |
          python llm_capability_study/audit_gold_readiness.py
          python llm_capability_study/build_validation_dataset.py --version ci_readiness_draft
          python llm_capability_study/audit_sampling_design.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("llm_capability_study/validation_dataset/ci_readiness_draft/composition_report.json")
          report = json.loads(p.read_text(encoding="utf-8"))
          print("Draft total:", report["n_total"])
          print("Legal source not yet verified:", report["n_legal_basis_pending"])
          print("Target definitions awaiting signed-off source:", report["n_catalog_source_pending"])
          print("Structural/CAS errors:", len(report["errors"]))
          from pathlib import Path
          sampling = json.loads(Path("llm_capability_study/candidates/review_audit_output/sampling_design_report.json").read_text())
          print("Sampling class balance:", sampling["gold_counts"])
          print("Missing positive targets:", len(sampling["target_ids_with_no_positive"]))
          assert not report["errors"], "Resolve deterministic errors before Gold freeze"
          assert report["frozen"] is False, "CI must never freeze the Gold dataset"
          PY
      - name: Upload Gold readiness audit and draft (not frozen)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-readiness-draft
          path: |
            llm_capability_study/candidates/review_audit_output/
            llm_capability_study/validation_dataset/ci_readiness_draft/
          if-no-files-found: warn
