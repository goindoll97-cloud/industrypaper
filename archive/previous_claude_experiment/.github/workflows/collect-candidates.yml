name: Collect validation candidates

on:
  workflow_dispatch:
    inputs:
      online:
        type: boolean
        description: "Call PubChem PUG REST (otherwise only rebuild the pool offline)"
        default: true
      target_total:
        description: "Validation set size including the 112 frozen baseline cases"
        default: "300"
        type: string

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install RDKit
        run: pip install rdkit
      - name: Reuse cached PubChem responses
        uses: actions/cache@v4
        with:
          path: llm_capability_study/collection_output/_work
          key: candidates-pubchem-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            candidates-pubchem-${{ runner.os }}-
      - name: Unit tests
        run: |
          python llm_capability_study/tests/test_prereview.py
          python llm_capability_study/tests/test_validation_pipeline.py
          python llm_capability_study/tests/test_collect_candidates.py
      - name: Collect, de-duplicate and pre-review (no Gold is assigned)
        shell: bash
        run: |
          ONLINE=""
          if [[ "${{ inputs.online }}" == "true" ]]; then ONLINE="--online"; fi
          python llm_capability_study/collect_candidates.py $ONLINE --target-total "${{ inputs.target_total }}"
      - name: Archive the single candidates folder
        uses: actions/upload-artifact@v4
        with:
          name: candidates
          path: llm_capability_study/candidates/
          if-no-files-found: error
          retention-days: 30
