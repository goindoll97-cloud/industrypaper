name: B90 benchmark offline regression tests

on:
  push:
    paths:
      - "llm_capability_study/retrieval_v4/**"
      - ".github/workflows/retrieval-v4-tests.yml"
      - ".gitattributes"
      - "llm_capability_study/expanded_b90/**"
      - "llm_capability_study/supplementary/b90_repeat5/**"
  pull_request:
    paths:
      - "llm_capability_study/retrieval_v4/**"
      - ".github/workflows/retrieval-v4-tests.yml"
      - ".gitattributes"
      - "llm_capability_study/expanded_b90/**"
      - "llm_capability_study/supplementary/b90_repeat5/**"

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: llm_capability_study/retrieval_v4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check source-file SHA and safe Windows CRLF recovery
        run: |
          python preflight.py
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          target = Path('data/pilot_12_ids.json')
          original = target.read_bytes()
          assert b'\r\n' not in original
          target.write_bytes(original.replace(b'\n', b'\r\n'))
          blocked = subprocess.run([sys.executable, 'preflight.py'], capture_output=True, text=True)
          assert blocked.returncode != 0
          assert 'CRLF' in blocked.stdout + blocked.stderr
          assert target.read_bytes() != original
          fixed = subprocess.run([sys.executable, 'preflight.py', '--fix-windows-eol'], capture_output=True, text=True)
          assert fixed.returncode == 0, fixed.stdout + fixed.stderr
          assert target.read_bytes() == original
          print('PASS: CRLF-only data safely recovered and SHA verified')
          PY
      - name: Test new B-only 90-case selection and fail-closed expert-review gate
        run: |
          python -m py_compile ../expanded_b90/prepare_b90.py ../expanded_b90/run_b90.py ../expanded_b90/score_b90.py
          python -m unittest discover -s ../expanded_b90/tests -p "test_*.py" -v
      - name: Test Gold-safe parsing, staged scoring and raw diagnosis
        run: python -m unittest discover -s tests -p "test_*.py" -v
