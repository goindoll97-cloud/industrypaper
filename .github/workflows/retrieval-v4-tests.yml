name: Retrieval v4 offline regression tests

on:
  push:
    paths:
      - "llm_capability_study/retrieval_v4/**"
      - "llm_capability_study/make_paper_report.py"
      - ".github/workflows/retrieval-v4-tests.yml"
  pull_request:
    paths:
      - "llm_capability_study/retrieval_v4/**"
      - "llm_capability_study/make_paper_report.py"
      - ".github/workflows/retrieval-v4-tests.yml"

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: llm_capability_study/retrieval_v4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate manuscript summary script
        run: |
          python -m py_compile ../make_paper_report.py
          python ../make_paper_report.py --help
      - name: Test Gold-safe parsing, staged scoring and raw diagnosis
        run: python -m unittest discover -s tests -p "test_*.py" -v
